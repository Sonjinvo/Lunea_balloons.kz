<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7fb">
  <meta name="description" content="Lunea Balloons — студия воздушных шаров в Алматы. Индивидуальные композиции для дня рождения, выписки и мероприятий.">
  <title>Lunea Balloons | Студия воздушных шаров</title>
  <style>
    :root {
      --pink: #d98eae;
      --pink-dark: #a94f78;
      --ink: #382b35;
      --muted: #786b75;
      --paper: #fffafd;
      --line: #f0dce6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, #f9e1ed 0, transparent 28%),
        radial-gradient(circle at 90% 85%, #f5e7f1 0, transparent 30%),
        #fff7fb;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(100%, 470px);
      padding: 38px 28px 30px;
      text-align: center;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 18px 55px rgba(125, 73, 101, .12);
    }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: white; font-size: 34px;
      background: linear-gradient(145deg, #edb7ce, #c879a0);
      box-shadow: 0 8px 22px rgba(201,121,160,.25);
    }
    h1 {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(34px, 8vw, 43px);
      font-weight: 500;
      letter-spacing: 1px;
    }
    .subtitle {
      margin: 9px 0 25px;
      color: var(--pink-dark);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .description {
      margin: 0 auto 24px;
      max-width: 330px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }
    .description strong { color: var(--ink); font-weight: 600; }
    .discount {
      margin: 0 0 24px;
      padding: 13px 16px;
      border: 1px dashed #d99ab6;
      border-radius: 15px;
      color: var(--pink-dark);
      background: #fff5fa;
      font-weight: 700;
    }
    .links { display: grid; gap: 11px; }
    .link {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--ink); text-decoration: none;
      background: white; font-weight: 700;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .link:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(125,73,101,.10); }
    .link.primary { color: white; border-color: transparent; background: #c879a0; }
    .link.primary:hover { background: #b8668e; }
    .icon { font-size: 19px; }
    footer { margin-top: 24px; color: #a3929d; font-size: 12px; letter-spacing: 1px; }
    @media (max-width: 380px) { .card { padding: 30px 19px 24px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">🎈</div>
    <h1>Lunea Balloons</h1>
    <p class="subtitle">Лунеа | Студия воздушных шаров</p>

    <p class="description">
      <strong>Индивидуальные композиции</strong><br>
      День рождения / Выписка / Мероприятие
    </p>

    <p class="discount">При самовывозе скидка 5%</p>

    <nav class="links" aria-label="Контакты">
      <a class="link primary" href="https://wa.me/77076502570" target="_blank" rel="noopener noreferrer">
        <span class="icon">✆</span> Заказ в WhatsApp
      </a>
      <a class="link" href="https://www.instagram.com/lunea_balloons_kz?obrf=bzNvbm1vNmgxM3Uz" target="_blank" rel="noopener noreferrer">
        <span class="icon">◎</span> Заказ в Direct
      </a>
      <a class="link" href="tel:+77076502570">
        <span class="icon">☎</span> Позвонить: 8 707 650 2570
      </a>
      <a class="link" href="https://2gis.kz/almaty/search/Raiymbek%20481%2F1" target="_blank" rel="noopener noreferrer">
        <span class="icon">⌖</span> Мы на 2ГИС
      </a>
    </nav>

    <footer>ALMATY · LUNEA BALLOONS</footer>
  </main>
</body>
</html>
